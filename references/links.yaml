# 官方发布页
# 取用方式见 references/toolchain.md

powershell:
  name: PowerShell 7
  release_page: https://github.com/PowerShell/PowerShell/releases
  latest_api: https://api.github.com/repos/PowerShell/PowerShell/releases/latest
  asset_pattern: "PowerShell-{version}-win-x64.zip"
  docs: https://learn.microsoft.com/powershell/

git:
  name: Git for Windows
  download_page: https://git-scm.com/download/win
  release_page: https://github.com/git-for-windows/git/releases
  docs: https://git-scm.com/doc
  note: 用安装程序，装哪由用户选。装完 <git-root>/usr/bin 里带一整套 GNU 工具，路径要现查不要硬编码

jq:
  name: jq
  home: https://jqlang.org
  download_page: https://jqlang.org/download/
  release_page: https://github.com/jqlang/jq/releases
  latest_api: https://api.github.com/repos/jqlang/jq/releases/latest
  asset_pattern: jq-windows-amd64.exe
  docs: https://jqlang.org/manual/

ripgrep:
  name: ripgrep
  release_page: https://github.com/BurntSushi/ripgrep/releases
  latest_api: https://api.github.com/repos/BurntSushi/ripgrep/releases/latest
  asset_pattern: "*x86_64-pc-windows-msvc.zip"
  docs: https://github.com/BurntSushi/ripgrep/blob/master/GUIDE.md

uv:
  name: uv
  install_page: https://docs.astral.sh/uv/getting-started/installation/
  docs: https://docs.astral.sh/uv/
  release_page: https://github.com/astral-sh/uv/releases
  installer_ps1: https://astral.sh/uv/install.ps1
  note: 官方安装器自带 uv 和 uvx，装到 %USERPROFILE%/.local/bin

curl:
  name: curl
  home: https://curl.se
  download_page: https://curl.se/windows/
  note: Windows 10 1803+ 自带 C:/Windows/System32/curl.exe，通常不需要装

wget:
  name: wget
  home: https://www.gnu.org/software/wget/
  note: GNU 官方不提供 Windows 二进制。有 curl 就别装

winget:
  name: winget
  docs: https://learn.microsoft.com/windows/package-manager/winget/
  note: 负责安装 MSI / Store 包；本 skill 的单文件便携工具（jq / rg / uv）不要走 winget，直接下官方二进制
